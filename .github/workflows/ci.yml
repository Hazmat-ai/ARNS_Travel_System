name: Build and verify ARNS
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and test
        shell: bash
        run: ./mvnw -B -Djava.awt.headless=true verify
      - name: Verify runnable JAR
        shell: bash
        run: java -Darns.dataDir=target/jar-smoke -jar target/arns-travel.jar --check
      - uses: actions/upload-artifact@v4
        with:
          name: arns-jar-${{ matrix.os }}
          path: target/arns-travel.jar
          retention-days: 7
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: xvfb-run -a ./mvnw -B -Djava.awt.headless=false -Darns.requireDesktop=true -Dtest=DesktopFlowTest test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-test-reports
          path: target/surefire-reports/
